# ====================================================================
# WebPilot Master Configuration (YAML Format)
# ====================================================================

# 1. Framework General Options
framework:
  name: "WebPilot AI-Native QE Framework"
  version: "1.0.0"
  activeProvider: "azure"
  defaultEnvironment: "qa"
  interactive: true
  useBrowserUse: true
  healingCachePath: "./healing-cache/cache.json"
  generatedCodePath: "./framework"
  validationLoopEnabled: true
  validationRetries: 3
  reportsPath: "./reports"
  artifactsPath: "./artifacts"
  htmlReport: true # generate reports/index.html after each browser-use run
  htmlReportAiAnalysis: true # LLM quality analysis section (editable in prompts/reports/)
  apiCodegenEnabled: true # generate framework/apis + framework/tests/api after successful API runs
  useApiPlaywright: true # execute API tests via Playwright request (not axios)

# 2. Browser Execution Options
browser:
  target: "chrome" # chrome (Google Chrome), chromium, msedge — browser-use channel
  headless: false
  video: "on" # off, on, retain-on-failure — "on" records every WebPilot/browser-use run
  screenshots: "only-on-failure" # off, on, only-on-failure
  trace: "on" # off, on, retain-on-failure — saves Playwright trace zips under reports/traces
  viewport:
    width: 1280
    height: 720
  emulateMobile: false
  permissions:
    - "geolocation"
    - "notifications"
  networkThrottling: "none"
  downloadsPath: "./artifacts/downloads"

# 3. Test Runner & Execution Options
execution:
  parallelWorkers: 4
  timeout: 60000
  retries: 1
  sharding:
    enabled: false
    totalShards: 1
    shardIndex: 0
  selfHealing:
    enabled: true
    similarityThreshold: 0.7
    autoUpdateCache: true
  reporters:
    - "html"
    - "json"
    - "junit"
  accessibilityTesting:
    enabled: true
    standards:
      - "WCAG2AA"
  visualTesting:
    enabled: false
    diffTolerance: 0.05

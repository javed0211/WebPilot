name: WebPilot

on:
  workflow_dispatch:

jobs:
  webpilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m pip install -U pip pip-audit
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-overrides.txt
          pip-audit --local
      - run: npx playwright install --with-deps chromium
      - run: npx webpilot ci doctor --provider browser-use
      - run: npx webpilot ci run tests/web --provider browser-use
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webpilot-report
          path: runtime/reports

name: WebPilot AI-Native QE Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Execute AI QE Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python (browser-use)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright System Binaries
        run: npx playwright install --with-deps chromium firefox

      - name: Compile and Run doctor Diagnostics
        run: npm run doctor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Execute WebPilot Autonomous UI Suite
        run: npm run webpilot -- run tests/web/login.txt --env qa
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

      - name: Archive Reports and Visual Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpilot-execution-reports
          path: |
            reports/
            .healing-cache/
          retention-days: 14

name: WebPilot AI-Native QE Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Execute AI QE Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install WebPilot
        run: pip install -e .

      - name: Install Playwright System Binaries
        run: python -m playwright install --with-deps chromium

      - name: Run doctor Diagnostics
        run: webpilot doctor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Execute WebPilot Autonomous UI Suite
        run: webpilot run tests/web/login.txt --env qa
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

      - name: Archive Reports and Visual Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpilot-execution-reports
          path: |
            reports/
            .healing-cache/
          retention-days: 14

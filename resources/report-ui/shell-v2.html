<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WebPilot · Execution Report</title>
  <style>
    :root {
      --bg:#f3f2ef; --side:#eae9e5; --panel:#fbfaf8; --panel-2:#f5f4f1;
      --ink:#17191d; --muted:#626872; --faint:#8a9099; --line:#d8d7d2;
      --accent:#3157d5; --accent-soft:#e8ecfb; --ok:#17734c; --ok-soft:#e3f1e9;
      --warn:#9b6413; --warn-soft:#f8ecd3; --bad:#b23a3a; --bad-soft:#f7e3e1;
      --critical:#7e2032; --shadow:0 10px 32px rgba(20,24,32,.08);
      --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
    }
    html[data-theme="dark"] {
      --bg:#0d1118; --side:#111720; --panel:#151c26; --panel-2:#101721;
      --ink:#edf0f5; --muted:#a5aebb; --faint:#7f8997; --line:#29313c;
      --accent:#7893ff; --accent-soft:#1e2c55; --ok:#62c896; --ok-soft:#15372c;
      --warn:#e5ad52; --warn-soft:#3b2d16; --bad:#ef7f79; --bad-soft:#402221;
      --critical:#ff92aa; --shadow:0 14px 36px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
    body{margin:0;min-height:100vh}
    button,a{font:inherit}
    a{color:var(--accent)}
    button{color:inherit}
    :focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 42%,transparent);outline-offset:2px}
    .app{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
    .brand{height:70px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid var(--line)}
    .brand-mark{width:27px;height:27px;position:relative;border:2px solid var(--accent);transform:rotate(45deg);border-radius:5px}
    .brand-mark:after{content:"";position:absolute;inset:5px;border:2px solid var(--accent);border-radius:2px}
    .brand strong{display:block;font-size:15px;letter-spacing:-.02em}
    .brand small{display:block;margin-top:2px;color:var(--faint);font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase}
    .nav{padding:16px 12px 12px}
    .nav a,.test-nav a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--muted);border-radius:7px}
    .nav a{height:36px;padding:0 10px;margin:2px 0;font-weight:600;font-size:13px}
    .nav a:hover,.nav a.active,.test-nav a:hover,.test-nav a.active{background:var(--panel);color:var(--ink)}
    .nav-ico{width:16px;text-align:center;font:12px var(--mono);color:var(--faint)}
    .side-label{padding:15px 22px 8px;color:var(--faint);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--line)}
    .test-nav{padding:0 12px;overflow:auto;flex:1}
    .test-nav a{padding:10px;margin:2px 0;align-items:flex-start}
    .test-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:var(--bad)}
    .test-dot.pass{background:var(--ok)}
    .test-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:1.35}
    .test-meta{display:block;margin-top:3px;color:var(--faint);font:10px var(--mono);text-transform:uppercase}
    .side-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .theme-btn,.mobile-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;height:32px;padding:0 10px}
    .theme-btn:hover,.mobile-btn:hover{border-color:var(--accent)}
    .side-foot span{font:10px var(--mono);color:var(--faint)}
    main{margin-left:260px;min-height:100vh}
    .topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:10}
    .crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--ink)}
    .top-actions{display:flex;gap:8px;align-items:center}
    .run-id{font:10px var(--mono);color:var(--faint);border:1px solid var(--line);padding:6px 8px;border-radius:5px}
    .mobile-btn{display:none}
    #view{max-width:1280px;margin:auto;padding:34px 38px 70px}
    .eyebrow{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:32px;line-height:1.08;letter-spacing:-.035em;margin-bottom:10px}
    h2{font-size:16px;letter-spacing:-.015em;margin-bottom:6px}
    h3{font-size:13px;margin-bottom:8px}
    .muted{color:var(--muted)} .mono{font-family:var(--mono)} .tabular{font-variant-numeric:tabular-nums}
    .hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:20px}
    .hero-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
    .chip,.status,.action,.grade,.risk,.mini-chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;font-weight:700;white-space:nowrap}
    .chip{border:1px solid var(--line);background:var(--panel);padding:5px 8px;font-size:11px}
    .verdict{text-align:right;flex:none}
    .verdict .word{font:700 29px var(--mono);letter-spacing:-.04em}
    .verdict .word.pass{color:var(--ok)}.verdict .word.fail{color:var(--bad)}
    .verdict small{display:block;color:var(--faint);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
    .kpis{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
    .kpi{padding:10px 12px;border-right:1px solid var(--line);min-width:0}.kpi:last-child{border:0}
    .kpi label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
    .kpi b{font:650 20px var(--mono);letter-spacing:-.04em}.kpi:first-child b{font-size:24px;color:var(--accent)}
    .kpi small{color:var(--faint);font:10px var(--mono);margin-left:5px}
    .delta{display:block!important;margin:4px 0 0!important;font:9px var(--mono)!important;color:var(--faint)!important}
    .delta.up{color:var(--ok)!important}.delta.down{color:var(--bad)!important}.delta.neutral{color:var(--faint)!important}
    .execution-strip{display:grid;grid-template-columns:repeat(6,auto) minmax(170px,1fr);border:1px solid var(--line);background:var(--panel);border-radius:7px;margin-bottom:10px;overflow:hidden}
    .execution-stat{padding:8px 11px;border-right:1px solid var(--line);white-space:nowrap}
    .execution-stat:last-child{border-right:0}.execution-stat label{display:block;color:var(--faint);font:8px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
    .execution-stat b{font:600 11px var(--mono)}.execution-context{text-align:right}
    .governance{position:relative;background:#0f1624;color:#e9eef8;border-radius:9px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow);border-top:3px solid #7fd7a8}
    .governance.medium{border-top-color:#ecba62}.governance.high,.governance.critical{border-top-color:#f28b84}
    html[data-theme="dark"] .governance{background:#060b13;box-shadow:0 0 0 1px #2b3547,var(--shadow)}
    .gov-layout{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(125px,.7fr));align-items:stretch}
    .gov-main{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:14px 18px;align-items:center}
    .gov-main h2{margin:4px 0 0;font-size:15px;letter-spacing:-.02em}
    .gov-copy{margin:12px 0 0;color:#aab6c8;font-size:12px}
    .stack-bar{display:flex;height:8px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.08);margin:10px 0 7px}
    .stack-bar i{display:block;height:100%}
    .stack-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font:9px var(--mono)}
    .stack-legend span{display:inline-flex;align-items:center;gap:6px;color:#aab6c8}
    .stack-legend i{width:8px;height:8px;border-radius:2px;flex:none}
    .stack-legend b{color:#e9eef8}
    .gov-metrics{display:contents}
    .gov-metrics div{padding:14px 16px;border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:center}
    .gov-metrics div:last-child{border-right:0}
    .gov-metrics label{display:block;color:#93a0b4;font-size:10px;margin-bottom:7px;letter-spacing:.06em}
    .gov-metrics b{font:650 19px var(--mono)}.gov-metrics small{display:block;color:#8f9bad;margin-top:3px;font-size:9px}
    .governance .dial-value b{color:#f2f5fa}.governance .dial-value small{color:#93a0b4}
    .governance .risk-dial path{stroke:#28334a}.governance .risk-dial line{stroke:#54617a}
    .governance .risk-dial.low path.on{stroke:#7fd7a8}.governance .risk-dial.medium path.on{stroke:#ecba62}.governance .risk-dial.high path.on,.governance .risk-dial.critical path.on{stroke:#f28b84}
    .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 12px}
    .section-head p{margin:0;color:var(--muted);font-size:12px}
    .table-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:var(--panel)}
    table{border-collapse:collapse;width:100%;font-size:12px}
    th{text-align:left;padding:10px 14px;color:var(--faint);font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);border-bottom:1px solid var(--line)}
    td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr:last-child td{border-bottom:0}.click-row{cursor:pointer}.click-row:hover td{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
    .status,.grade,.risk,.action{padding:4px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
    .status.pass,.verified{color:var(--ok);background:var(--ok-soft)}.status.fail,.unverified{color:var(--bad);background:var(--bad-soft)}
    .risk.low{color:var(--ok);background:var(--ok-soft)}.risk.medium{color:var(--warn);background:var(--warn-soft)}.risk.high,.risk.critical{color:var(--bad);background:var(--bad-soft)}
    .grade{color:var(--accent);background:var(--accent-soft)}
    .meter{width:80px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
    .detail-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:26px}
    .back{display:inline-block;font-size:11px;text-decoration:none;margin-bottom:15px}
    .evidence-link{display:inline-flex;border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:7px;text-decoration:none;font-size:11px}
    .gov-panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;margin-bottom:28px;overflow:hidden}
    .gov-panel-top{display:grid;grid-template-columns:1.35fr 1fr 1fr;border-bottom:1px solid var(--line)}
    .risk-block{display:flex;gap:24px;align-items:center;padding:24px;border-right:1px solid var(--line)}
    .risk-dial{flex:none;position:relative;display:grid;place-items:center}
    .risk-dial svg{position:absolute;inset:0;width:100%;height:100%}
    .risk-dial path{fill:none;stroke:var(--line);stroke-width:8;stroke-linecap:butt}
    .risk-dial path.on{stroke:var(--ok)}
    .risk-dial.medium path.on{stroke:var(--warn)}
    .risk-dial.high path.on,.risk-dial.critical path.on{stroke:var(--bad)}
    .risk-dial line{stroke:var(--faint);stroke-width:1.4}
    .dial-value{text-align:center}.dial-value b{display:block;font:700 31px var(--mono);letter-spacing:-.06em}.dial-value small{font:9px var(--mono);color:var(--faint);text-transform:uppercase}
    .factor-list{flex:1}.factor{margin:10px 0}.factor-line{display:flex;justify-content:space-between;gap:12px;font:11px var(--mono);margin-bottom:5px}
    .factor-line b{color:var(--bad)}.factor-bar{height:4px;background:var(--line)}.factor-bar i{display:block;height:100%;background:var(--bad)}
    .grade-block,.verify-block{padding:24px}
    .grade-letter{font:750 46px var(--mono);color:var(--accent);line-height:1}.metric-big{font:700 30px var(--mono)}
    .warning-list{padding-left:16px;color:var(--warn);font-size:11px;line-height:1.5;margin:11px 0 0}
    .verify-ring{height:7px;background:var(--line);margin:13px 0 8px}.verify-ring i{display:block;height:100%;background:var(--ok)}
    .gov-strip{display:grid;grid-template-columns:repeat(3,1fr)}.gov-strip div{padding:15px 20px;border-right:1px solid var(--line)}.gov-strip div:last-child{border:0}
    .gov-strip label{display:block;color:var(--faint);font-size:10px;margin-bottom:5px}.gov-strip b{font:650 14px var(--mono)}
    .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
    .tabs button{border:0;background:transparent;padding:10px 13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:11px;font-weight:650}
    .tabs button.active{color:var(--accent);border-color:var(--accent)}
    .panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:20px;margin-bottom:20px}
    .timeline{position:relative}.timeline:before{content:"";position:absolute;left:18px;top:20px;bottom:20px;width:1px;background:var(--line)}
    .event{display:grid;grid-template-columns:37px 1fr;gap:12px;position:relative;padding:9px 0}
    .event-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin:13px 0 0 14px;z-index:1;box-shadow:0 0 0 4px var(--panel)}
    .event.error .event-dot{background:var(--bad)}.event-body{border:1px solid var(--line);border-radius:7px;padding:13px 15px}
    .event.error .event-body{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-soft) 35%,var(--panel))}
    .event-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.event-top .index{font:10px var(--mono);color:var(--faint)}
    .action{--ac:#64748b;background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac)}
    .action.navigate{--ac:#5052c9}.action.click{--ac:#2b6cb8}.action.input{--ac:#0f766e}.action.wait{--ac:#64748b}.action.screenshot{--ac:#7a4fb0}.action.scroll{--ac:#6d7c2b}
    .action.assert{--ac:var(--warn)}.action.error{--ac:var(--bad)}
    html[data-theme="dark"] .action.navigate{--ac:#9b9df2}
    html[data-theme="dark"] .action.click{--ac:#7db3ec}
    html[data-theme="dark"] .action.input{--ac:#56c4ba}
    html[data-theme="dark"] .action.wait{--ac:#94a3b8}
    html[data-theme="dark"] .action.screenshot{--ac:#b894e8}
    html[data-theme="dark"] .action.scroll{--ac:#b0bf5f}
    .locator{font:11px/1.5 var(--mono);padding:7px 9px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;overflow-wrap:anywhere;margin-top:8px}
    .locator-state,.mini-chip{font:9px var(--mono);padding:3px 5px;border-radius:4px}
    .error-text{color:var(--bad);font:11px/1.5 var(--mono);margin:10px 0 0}
    .empty{padding:42px 20px;text-align:center;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}
    .empty b{display:block;color:var(--ink);margin-bottom:5px}
    .root-summary{font-size:15px;line-height:1.6;max-width:780px}.finding{border-left:3px solid var(--ok);padding:10px 13px;margin:12px 0;background:var(--panel-2)}
    .finding.uncited{border-left-color:var(--warn)}.finding p{margin:0 0 9px}.cite{font:9px var(--mono);padding:3px 5px;background:var(--accent-soft);color:var(--accent);border-radius:3px;margin-right:5px}
    .analysis{line-height:1.65;max-width:850px}.analysis h2{margin-top:20px}.analysis code{font:12px var(--mono);background:var(--panel-2);padding:2px 4px;border-radius:3px}
    .ai-brief{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-left:3px solid var(--accent);padding:14px 16px;margin-bottom:24px}
    .ai-brief .analysis{font-size:12px;line-height:1.45;max-height:72px;overflow:hidden}.ai-brief .analysis p{margin-bottom:0}.ai-brief .analysis h2{font-size:13px;margin:0 0 4px}
    .text-link{font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap}
    .ai-excerpt{display:block;max-width:390px;color:var(--muted);font-size:10px;line-height:1.35;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .analytics-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;margin-bottom:22px}
    .chart-panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:18px;min-width:0}
    .chart-panel h2{margin-bottom:3px}.chart-note{color:var(--muted);font-size:11px;margin-bottom:18px}
    .health-chart{height:190px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding:10px 4px 0}
    .health-col{height:100%;flex:1;min-width:30px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
    .health-stack{width:min(52px,75%);height:140px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--panel-2);border:1px solid var(--line)}
    .health-stack i{display:block;width:100%}.health-stack .failed{background:var(--bad)}.health-stack .retry{background:var(--warn)}.health-stack .passed{background:var(--ok)}
    .health-label{font:9px var(--mono);color:var(--faint);white-space:nowrap}
    .trend-rows{display:grid;gap:12px}.trend-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center}
    .trend-row label{font:9px var(--mono);color:var(--faint)}.trend-track{height:7px;background:var(--line);overflow:hidden}.trend-track i{display:block;height:100%;background:var(--accent)}
    .trend-pair{display:grid;gap:4px}.trend-track.cost{height:4px}.trend-track.cost i{background:var(--warn)}
    .trend-row b{font:10px var(--mono);font-weight:600;min-width:80px;text-align:right}
    .stability{display:grid;gap:9px}.stability-row{display:grid;grid-template-columns:minmax(130px,1fr) auto;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
    .stability-cells{display:flex;gap:4px}.stability-cell{width:22px;height:22px;border-radius:4px;background:var(--line);border:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
    .stability-cell.pass{background:var(--ok)}.stability-cell.fail{background:var(--bad)}
    .analysis-links{display:grid;gap:8px;margin-top:20px}.analysis-link{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
    .analysis-link span{color:var(--accent);font-size:11px}
    .overview-analytics{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:12px;margin-bottom:12px}
    .overview-chart{height:128px}.overview-chart .health-stack{height:86px;width:min(42px,70%)}
    .cause-list{display:grid;gap:8px}.cause-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
    .cause-row:first-child{border-top:0}.cause-row span{font-size:11px;line-height:1.35}.cause-row b{font:11px var(--mono);color:var(--bad)}
    .tri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
    .mini-analytic{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;min-width:0}
    .mini-analytic h3{margin-bottom:3px}.mini-analytic>p{font-size:10px;color:var(--muted);margin-bottom:13px}
    .rank-list{display:grid;gap:9px}.rank-item{min-width:0}.rank-item-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-bottom:5px}
    .rank-item-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-item-line b{font:10px var(--mono);white-space:nowrap}
    .microbar{height:4px;background:var(--line)}.microbar i{display:block;height:100%;background:var(--accent)}
    .insights-band{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(90deg,var(--accent-soft),var(--panel) 45%);border-radius:8px;margin-bottom:12px;overflow:hidden}
    .insights-flow{display:grid;grid-template-columns:1.25fr repeat(6,1fr)}
    .flow-lead,.insight-metric{padding:13px 14px;border-right:1px solid var(--line)}.insight-metric:last-child{border-right:0}
    .flow-path{font:650 12px/1.5 var(--mono);margin-top:5px}.flow-path span{color:var(--accent)}
    .insight-metric label{display:block;color:var(--faint);font:8px/1.35 var(--mono);letter-spacing:.05em;text-transform:uppercase;min-height:22px}
    .insight-metric b{display:block;font:650 17px var(--mono);margin-top:4px}

    function executionStrip(){

        <div class="execution-stat"><label>Executed</label><b>${dash(o.executed??o.total??report.testCases.length)}</b></div>

    function overviewKpis(){

      const flaky=report.testCases.filter(t=>historyStats(t).transitions>0).length,priorFlaky=report.testCases.filter(t=>historyStats(t,true).transitions>0).length;
      const retryCurrent=own(o,"retryRate")?n(o.retryRate):latest?.retryKnown?(latest.retryCount/Math.max(latest.total,1)*100):null;
      const retryPrevious=previous?.retryKnown?(previous.retryCount/Math.max(previous.total,1)*100):null;
      const prevPass=previous?.total?previous.passed/previous.total*100:null;
      return `<section class="kpis" aria-label="Run metrics">
        <div class="kpi"><label>Pass rate</label><b>${n(o.passRate)}%</b>${deltaMarkup(o.passRate,prevPass,{suffix:" pts",digits:0})}</div>
        <div class="kpi"><label>Failed</label><b>${dash(o.failed)}</b>${deltaMarkup(o.failed,previous?.failed,{inverse:true})}</div>
        <div class="kpi"><label>Flaky</label><b>${flaky}</b>${deltaMarkup(flaky,priorFlaky,{inverse:true})}</div>
        <div class="kpi"><label>Actions</label><b>${dash(o.totalSteps)}</b>${deltaMarkup(o.totalSteps,previous?.actions,{neutral:true})}</div>
        <div class="kpi"><label>Retry</label><b>${retryCurrent==null?"—":`${Math.round(retryCurrent)}%`}</b>${deltaMarkup(retryCurrent,retryPrevious,{suffix:" pts",inverse:true})}</div>
        <div class="kpi"><label>Tokens</label><b>${num(o.totalTokens)}</b>${deltaMarkup(o.totalTokens,previous?.tokens,{neutral:true})}</div>
        <div class="kpi"><label>Cost</label><b>${money(o.totalCostUsd)}</b>${deltaMarkup(o.totalCostUsd,previous?.cost,{digits:3,neutral:true})}</div>

    function failureCauses(){
      const causes=new Map();
      const add=text=>{const clean=String(text||"").trim();if(clean)causes.set(clean,(causes.get(clean)||0)+1);};
      report.testCases.filter(t=>String(t.status).toUpperCase()==="FAILED").forEach(t=>{
        arr(t.evidenceTimeline).filter(e=>e.error).forEach(e=>add(e.error));
        const findings=arr(t.rootCauseAnalysis?.findings);
        if(findings.length)findings.forEach(f=>add(f.claim));else add(t.rootCauseAnalysis?.summary);
      });
      return [...causes].map(([text,count])=>({text,count})).sort((a,b)=>b.count-a.count||a.text.localeCompare(b.text)).slice(0,4);

    function compactHealth(){

    function topList(items,valueLabel,barValue){

    }
    function compactTriad(){
      const volatility=report.testCases.map(t=>({...t,_stats:historyStats(t)})).sort((a,b)=>b._stats.volatility-a._stats.volatility);

        <section class="mini-analytic"><h3>Slowest tests</h3><p>${report.testCases.some(t=>t.durationMs!=null||t.totalDurationMs!=null)?"Longest runtime":"Longest by action count"}</p>${topList(slow,x=>x.durationMs!=null||x.totalDurationMs!=null?duration(x.durationMs??x.totalDurationMs):`${n(x.stepsExecuted)} actions`,x=>n(x.durationMs??x.totalDurationMs??x.stepsExecuted))}</section>

    function insightsBand(){
      const findings=report.testCases.flatMap(t=>arr(t.rootCauseAnalysis?.findings)).filter(f=>Number.isFinite(Number(f.confidence)));
      const confidence=findings.length?Math.round(findings.reduce((a,f)=>a+n(f.confidence),0)/findings.length*100):null;
      const heals=report.testCases.flatMap(t=>arr(t.evidenceHealing)),learned=heals.filter(h=>h.committed).length;

      let recovered=0;report.testCases.forEach(t=>{const h=historyStats(t).history;for(let i=1;i<h.length;i++)if(String(h[i-1].status).toUpperCase()==="FAILED"&&String(h[i].status).toUpperCase()==="PASSED")recovered++;});
      const generated=report.overview?.generatedTests??report.generatedTests, saved=report.overview?.estimatedHoursSaved??report.estimatedHoursSaved;

    function rankedData(mode){

        ${report.testCases.length?`<div class="table-wrap"><table><thead><tr><th>Status</th><th>Test case</th><th>Steps</th><th>Risk</th><th>Grade</th><th>Verified</th><th>Cost</th><th></th></tr></thead><tbody>${report.testCases.map(t=>`<tr class="click-row" tabindex="0" data-href="#test-${esc(t.slug)}"><td>${statusPill(t.status)}</td><td><strong>${esc(t.testName||t.slug)}</strong><span class="test-meta">${esc(date(t.timestamp))}</span>${t.aiAnalysis?`<span class="ai-excerpt">${esc(excerpt(t.aiAnalysis))}</span>`:""}</td><td class="mono">${n(t.stepsExecuted)}</td><td>${t.risk?pill("risk",`${t.risk.score} · ${t.risk.level}`,t.risk.level):"—"}</td><td>${t.completeness?pill("grade",t.completeness.grade):"—"}</td><td>${t.evidenceLocators?`<div class="meter" title="${Math.round(n(t.evidenceLocators.verifiedRatio)*100)}% verified"><i style="width:${Math.round(n(t.evidenceLocators.verifiedRatio)*100)}%"></i></div>`:"—"}</td><td class="mono">${money(t.pricing?.estimatedCostUsd)}</td><td><a href="#test-${esc(t.slug)}" aria-label="Open ${esc(t.testName||t.slug)}">→</a></td></tr>`).join("")}</tbody></table></div>`:empty("No test results","This report contains no test cases.")}`;

    function artifactsView(t){const a=t.artifacts||{}, shots=arr(a.screenshots), any=shots.length||a.video||a.trace;if(!any)return empty("No artifacts","No media or traces were attached.");return `<div class="artifact-grid">${a.video?`<div class="artifact"><video controls preload="metadata"><source src="${esc(safePath(a.video))}">Video unavailable.</video><span>${esc(a.video)}</span></div>`:""}${shots.map(src=>`<div class="artifact"><img src="${esc(safePath(src))}" alt="Execution screenshot" data-full="${esc(safePath(src))}" onerror="this.remove();this.parentElement.insertAdjacentHTML('afterbegin','<span>Screenshot unavailable</span>')"><span>${esc(src)}</span></div>`).join("")}${a.trace?`<a class="artifact" href="${esc(safePath(a.trace))}"><strong>Open trace archive</strong><span>${esc(a.trace)}</span></a>`:""}</div>`;}

    function costView(t){const p=t.pricing||{};return `<div class="panel"><div class="kpis" style="margin:0"><div class="kpi"><label>Total tokens</label><b>${num(p.totalTokens)}</b></div><div class="kpi"><label>Prompt</label><b>${num(p.promptTokens)}</b></div><div class="kpi"><label>Completion</label><b>${num(p.completionTokens)}</b></div><div class="kpi"><label>LLM calls</label><b>${num(p.llmCalls)}</b></div><div class="kpi"><label>Estimated cost</label><b>${money(p.estimatedCostUsd)}</b></div></div><p class="muted mono" style="margin:15px 0 0">${esc(p.provider||"Unknown provider")} · ${esc(p.model||"Unknown model")}</p></div>`;}
    const tabRenderer=(key,t)=>({timeline:timelineView,locators:locatorView,healing:healingView,drift:driftView,root:rootView,analysis:analysisView,artifacts:artifactsView,history:historyView,cost:costView}[key]||timelineView)(t);
    function renderDetail(t,initialTab="timeline"){
      if(!t)return empty("Test not found","The requested test does not exist in this report.");
      const active=detailTabs.some(x=>x[0]===initialTab)?initialTab:"timeline";
      return `<a class="back" href="#overview">← Back to overview</a><section class="detail-head"><div><div class="event-top">${statusPill(t.status)}<span class="muted">${esc(date(t.timestamp))}</span></div><h1>${esc(t.testName||t.slug)}</h1><p class="muted">${n(t.stepsExecuted)} steps · ${money(t.pricing?.estimatedCostUsd)} estimated cost</p>${t.aiAnalysis?`<span class="ai-excerpt">${esc(excerpt(t.aiAnalysis))}</span>`:""}</div>${t.evidenceRef?`<a class="evidence-link" href="${esc(safePath(evidenceHref(t.evidenceRef)))}">Open Evidence JSON ↗</a>`:""}</section>${govPanel(t)}
        <div class="tabs" role="tablist" aria-label="Test detail sections">${detailTabs.map(x=>`<button type="button" role="tab" data-tab="${x[0]}" class="${x[0]===active?"active":""}" aria-selected="${x[0]===active}">${x[1]}</button>`).join("")}</div><section id="tab-content">${tabRenderer(active,t)}</section>`;
    }
    function aggregateRuns(){
      const runs=new Map();
      report.testCases.forEach(t=>arr(t.runHistory).forEach((h,index)=>{
        const key=String(h.runId||h.timestamp||`${t.slug||"test"}-${index}`);
        const ts=new Date(h.timestamp).getTime();
        if(!runs.has(key))runs.set(key,{key,label:h.runId||date(h.timestamp),timestamp:Number.isFinite(ts)?ts:0,passed:0,retry:0,failed:0,total:0,actions:0,tokens:0,cost:0,retryCount:0,retryKnown:false});
        const r=runs.get(key), status=String(h.status||"").toUpperCase();
        const rawRetry=h.retryCount??h.retries??(Number.isFinite(Number(h.attempts))?Math.max(0,Number(h.attempts)-1):undefined),retries=rawRetry==null?0:n(rawRetry);
        r.timestamp=Math.max(r.timestamp,Number.isFinite(ts)?ts:0);r.total++;r.actions+=n(h.stepsExecuted);
        if(rawRetry!=null){r.retryKnown=true;r.retryCount+=retries;}
        if(status==="FAILED")r.failed++;else if(retries>0)r.retry++;else if(status==="PASSED")r.passed++;
        r.tokens+=n(h.pricing?.totalTokens);r.cost+=n(h.pricing?.estimatedCostUsd);
      }));
      return [...runs.values()].sort((a,b)=>a.timestamp-b.timestamp);
    }
    function renderTrends(){
      const runs=aggregateRuns();
      if(!runs.length)return `<section class="hero"><div><span class="eyebrow">Execution analytics</span><h1>Trends</h1><p class="muted">Health, usage, and stability from recorded run history.</p></div></section>${empty("No historical runs","Trend analytics appear after tests include runHistory records.")}`;
      const maxTokens=Math.max(...runs.map(r=>r.tokens),1),maxCost=Math.max(...runs.map(r=>r.cost),.0001);
      const shortDate=ts=>ts?new Date(ts).toLocaleDateString([], {month:"short",day:"numeric"}):"Unknown";
      return `<section class="hero"><div><span class="eyebrow">Execution analytics</span><h1>Trends</h1><p class="muted">Computed from ${runs.length} recorded suite runs across ${report.testCases.length} tests.</p></div></section>
        <div class="analytics-grid">
          <section class="chart-panel"><h2>Execution health</h2><p class="chart-note">Pass/retry/fail composition by run date</p><div class="health-chart" role="img" aria-label="Pass, retry, and fail totals by run">${runs.map(r=>`<div class="health-col" title="${esc(r.label)}: ${r.passed} passed, ${r.retry} retried, ${r.failed} failed"><div class="health-stack"><i class="failed" style="height:${r.total?r.failed/r.total*100:0}%"></i><i class="retry" style="height:${r.total?r.retry/r.total*100:0}%"></i><i class="passed" style="height:${r.total?r.passed/r.total*100:0}%"></i></div><span class="health-label">${esc(shortDate(r.timestamp))}</span></div>`).join("")}</div></section>
          <section class="chart-panel"><h2>Token & cost trend</h2><p class="chart-note"><span style="color:var(--accent)">Tokens</span> · <span style="color:var(--warn)">Estimated cost</span></p><div class="trend-rows">${runs.map(r=>`<div class="trend-row"><label>${esc(shortDate(r.timestamp))}</label><div class="trend-pair"><div class="trend-track" title="${num(r.tokens)} tokens"><i style="width:${r.tokens/maxTokens*100}%"></i></div><div class="trend-track cost" title="${money(r.cost)} estimated cost"><i style="width:${r.cost/maxCost*100}%"></i></div></div><b>${num(r.tokens)} · ${money(r.cost)}</b></div>`).join("")}</div></section>
        </div>
        <section class="chart-panel"><h2>Per-test stability</h2><p class="chart-note">Oldest to newest recorded status</p><div class="stability">${report.testCases.map(t=>{const history=arr(t.runHistory).slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));return `<div class="stability-row"><div><strong>${esc(t.testName||t.slug)}</strong><span class="test-meta">${history.length} recorded run${history.length===1?"":"s"}</span></div><div class="stability-cells">${history.length?history.map(h=>`<span class="stability-cell ${String(h.status).toUpperCase()==="PASSED"?"pass":"fail"}" title="${esc(date(h.timestamp))} · ${esc(h.status||"unknown")}"></span>`).join(""):`<span class="muted">No history</span>`}</div></div>`}).join("")}</div></section>`;
    }
    function renderSuiteAnalysis(){
      const tests=report.testCases.filter(t=>t.aiAnalysis);
      return `<section class="hero"><div><span class="eyebrow">Model-assisted triage</span><h1>AI analysis</h1><p class="muted">Generated findings grounded in this execution report.</p></div></section>
        ${report.suiteAiAnalysis?`<section class="panel analysis">${safeMarkdown(report.suiteAiAnalysis)}</section>`:empty("No suite analysis","This run does not include suite-level AI analysis.")}
        ${tests.length?`<section class="panel"><h2>Test analyses</h2><p class="muted">Open the full analysis attached to each test.</p><div class="analysis-links">${tests.map(t=>`<a class="analysis-link" href="#test-${esc(t.slug)}?tab=analysis"><div><strong>${esc(t.testName||t.slug)}</strong><span class="ai-excerpt">${esc(excerpt(t.aiAnalysis))}</span></div><span>Open analysis →</span></a>`).join("")}</div></section>`:""}`;
    }
    function renderEnvironment(){
      const groups=[["Environment",[["Name",report.environment?.name],["Base URL",report.environment?.baseUrl]]],["Browser",[["Target",report.browser?.target],["Mode",report.browser?.headless?"Headless":"Headed"],["Viewport",report.browser?.viewport?`${report.browser.viewport.width} × ${report.browser.viewport.height}`:"Not recorded"]]],["Framework",[["Name",report.framework?.name],["Version",report.framework?.version],["Generated",date(report.generatedAt)]]]];
      return `<section class="hero"><div><span class="eyebrow">Execution context</span><h1>Environment & runtime</h1><p class="muted">The exact platform facts attached to this report.</p></div></section><div class="env-grid">${groups.map(g=>`<section class="fact"><h2>${g[0]}</h2><dl>${g[1].map(x=>`<div><dt>${x[0]}</dt><dd>${esc(x[1]||"Not provided")}</dd></div>`).join("")}</dl></section>`).join("")}</div>`;
    }
    function renderLogs(){
      return `<section class="hero"><div><span class="eyebrow">Recorded executions</span><h1>Test logs</h1><p class="muted">Open a test to inspect its timeline and diagnostic evidence.</p></div></section>${report.testCases.length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Test</th><th>Status</th><th>Runtime insight</th><th></th></tr></thead><tbody>${report.testCases.map(t=>`<tr><td class="mono">${esc(date(t.timestamp))}</td><td><strong>${esc(t.testName||t.slug)}</strong></td><td>${statusPill(t.status)}</td><td>${esc(arr(t.runtimeInsights)[0]?.message||"No diagnostic message")}</td><td><a href="#test-${esc(t.slug)}">Inspect →</a></td></tr>`).join("")}</tbody></table></div>`:empty("No logs","No test executions were recorded.")}`;
    }
    const view=$("#view"), crumb=$("#crumb");
    function bindCommon(){
      document.querySelectorAll(".click-row").forEach(row=>{const go=()=>location.hash=row.dataset.href;row.addEventListener("click",e=>{if(!e.target.closest("a"))go()});row.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});
      document.querySelectorAll(".artifact img").forEach(img=>img.addEventListener("click",()=>{const d=$("#lightbox");$("img",d).src=img.dataset.full;d.showModal()}));
      document.querySelectorAll("[data-rank]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("[data-rank]").forEach(b=>{b.classList.toggle("active",b===btn);b.setAttribute("aria-selected",String(b===btn))});const body=$("#rank-body");if(body)body.innerHTML=rankedRows(btn.dataset.rank)}));
    }
    function route(){
      const hash=(location.hash||"#overview").slice(1),[path,query=""]=hash.split("?"),params=new URLSearchParams(query),isTest=path.startsWith("test-"),slug=isTest?path.slice(5):"",t=report.testCases.find(x=>String(x.slug)===slug);
      if(isTest){view.innerHTML=renderDetail(t,params.get("tab")||"timeline");crumb.textContent=t?.testName||"Test detail";bindTabs(t);}
      else if(path==="trends"){view.innerHTML=renderTrends();crumb.textContent="Trends";}
      else if(path==="ai-analysis"){view.innerHTML=renderSuiteAnalysis();crumb.textContent="AI analysis";}
      else if(path==="environment"){view.innerHTML=renderEnvironment();crumb.textContent="Environment";}
      else if(path==="logs"){view.innerHTML=renderLogs();crumb.textContent="Test logs";}
      else{view.innerHTML=renderOverview();crumb.textContent="Overview";}
      document.querySelectorAll("[data-route],.test-nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+path||(path==="overview"&&a.dataset.route==="overview")));
      bindCommon(); view.focus({preventScroll:true}); window.scrollTo(0,0); $("#sidebar").classList.remove("open");
    }
    function bindTabs(t){
      if(!t)return;
      document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("active",b===btn);b.setAttribute("aria-selected",String(b===btn))});$("#tab-content").innerHTML=tabRenderer(btn.dataset.tab,t);bindCommon()}));
    }
    $("#test-nav").innerHTML=report.testCases.map(t=>`<a href="#test-${esc(t.slug)}"><span class="test-dot ${String(t.status).toUpperCase()==="PASSED"?"pass":""}"></span><span class="test-name">${esc(t.testName||t.slug)}<span class="test-meta">${esc(t.status)} · ${n(t.stepsExecuted)} steps</span></span></a>`).join("");
    if(!report.suiteAiAnalysis&&!report.testCases.some(t=>t.aiAnalysis))$("#ai-nav").hidden=true;
    $("#run-id").textContent="RUN · "+new Date(report.generatedAt||Date.now()).toISOString().replace(/[-:]/g,"").slice(0,13);
    const preferred=localStorage.getItem("webpilot-report-theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");
    document.documentElement.dataset.theme=preferred; $("#theme").textContent=preferred==="dark"?"Light":"Dark";
    $("#theme").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("webpilot-report-theme",next);$("#theme").textContent=next==="dark"?"Light":"Dark"});
    $("#menu").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
    $("#lightbox button").addEventListener("click",()=>$("#lightbox").close()); $("#lightbox").addEventListener("click",e=>{if(e.target===$("#lightbox"))e.target.close()});
    addEventListener("hashchange",route); if(!location.hash) history.replaceState(null,"","#overview"); route();
  })();
  </script>
</body>
</html>

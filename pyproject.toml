[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webpilot-qe"
version = "2.0.0"
description = "AI-native Python quality engineering and Playwright automation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.12.0",
  "openai>=1.0.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "playwright>=1.52.0",
  "pytest>=8.0.0",
  "pytest-playwright>=0.7.0",
  "pytest-xdist>=3.6.0",
  "jsonschema>=4.23.0",
]

[project.scripts]
webpilot = "webpilot.cli:main"

[tool.setuptools.packages.find]
include = ["webpilot*", "framework*", "core*"]

[tool.pytest.ini_options]
testpaths = ["framework/tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --junitxml=reports/junit-results.xml"
markers = [
  "api: API-only Playwright tests",
  "booking: Booking.com browser tests",
]
